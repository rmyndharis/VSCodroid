<svg width="280" height="200" viewBox="0 0 280 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A folder picker listing the phone's storage -->
  <rect x="20" y="15" width="240" height="170" rx="8" fill="var(--vscode-sideBar-background, #252526)" stroke="var(--vscode-editorWidget-border)" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="20" y="15" width="240" height="26" rx="8" fill="var(--vscode-titleBar-activeBackground)"/>
  <rect x="20" y="33" width="240" height="8" fill="var(--vscode-titleBar-activeBackground)"/>
  <text x="140" y="32" font-family="monospace" font-size="10" fill="var(--vscode-titleBar-activeForeground)" text-anchor="middle">Documents</text>

  <!-- The chosen folder -->
  <rect x="30" y="50" width="220" height="30" rx="4" fill="var(--vscode-list-activeSelectionBackground, #094771)"/>
  <path d="M40 60h10l3 3h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H42a2 2 0 0 1-2-2V62a2 2 0 0 1 0-2z" fill="#dcb67a"/>
  <text x="80" y="70" font-family="monospace" font-size="11" fill="var(--vscode-list-activeSelectionForeground, #ffffff)">my-app</text>

  <!-- Other folders -->
  <path d="M40 92h10l3 3h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H42a2 2 0 0 1-2-2V94a2 2 0 0 1 0-2z" fill="#dcb67a" opacity="0.6"/>
  <text x="80" y="104" font-family="monospace" font-size="11" fill="var(--vscode-foreground, #cccccc)">notes</text>
  <path d="M40 122h10l3 3h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H42a2 2 0 0 1-2-2v-12a2 2 0 0 1 0-2z" fill="#dcb67a" opacity="0.6"/>
  <text x="80" y="134" font-family="monospace" font-size="11" fill="var(--vscode-foreground, #cccccc)">scripts</text>

  <!-- Button -->
  <rect x="60" y="152" width="160" height="24" rx="12" fill="var(--vscode-button-background, #0e639c)"/>
  <text x="140" y="168" font-family="sans-serif" font-size="11" fill="var(--vscode-button-foreground, #ffffff)" text-anchor="middle">Use this folder</text>
</svg>
