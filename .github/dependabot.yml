# Exists because pinning actions to commit SHAs took away the thing a floating
# tag was quietly providing.
#
# Every `uses:` in .github/workflows is pinned to a full 40-character commit,
# which is what stops a compromised tag from being resolved at run time inside
# the job that holds the signing keystore and publishes the release assets. The
# cost is that a pin never moves on its own: before, `@v4` picked up a security
# fix on the next run; after, it stays where it was written until somebody
# rewrites it. Nothing in the repository proposed those rewrites, so the pins
# would have aged silently, which is a slower version of the problem they were
# added to solve.
#
# Only github-actions. Gradle and npm dependencies here are resolved by lockfiles
# and by scripts that verify their own digests, and opening that surface is a
# separate decision with a separate review burden.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Two groups, split by update type, because they are different decisions
    # wearing the same shape.
    #
    # Measured on the first run of this config: every one of the twelve actions
    # was several majors behind, and a single group proposed checkout v4 to v7,
    # download-artifact v4 to v8 and action-gh-release v2 to v3 in one pull
    # request titled "bump the actions group with 12 updates". That reads as
    # routine and is twelve breaking-risk changes, in the workflows that hold the
    # signing keystore. upload-artifact and download-artifact in particular have
    # broken across majors before.
    #
    # Splitting them keeps the routine branch routine, which is what restores the
    # freshness a floating tag used to give, and leaves majors visible rather
    # than either hidden by an ignore rule or smuggled in beside patches.
    groups:
      actions-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: ci
    labels:
      - enhancement
