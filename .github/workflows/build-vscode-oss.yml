name: Build Code - OSS server

# Manual, and run once per VS Code version rather than once per app release: it
# clones the VS Code source and runs a full gulp build, which takes around
# twelve minutes. The tarball it publishes is what release.yml and local builds
# fetch, so the expensive build happens when the version moves, not on every
# tag. build.yml builds its own tree through the same codeoss-build.yml and
# publishes nothing.
on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: VS Code tag to build (defaults to the VSCODE_VERSION file)
        default: ""
        type: string
      runner:
        # Not a preference. Every native module in the tree is built for the
        # build host and only four are replaced afterwards; @vscode/ripgrep's
        # postinstall in particular downloads a binary for whatever the host
        # reports. On an x64 runner the tree builds green and then fails at exec
        # on the device, with Search quietly returning nothing. The build script
        # refuses to package an x86-64 tree, so a wrong runner fails the job
        # rather than shipping.
        description: Runner to build on (must be arm64)
        default: ubuntu-24.04-arm
        type: string

# Read by default; the one job that publishes raises it, the way release.yml
# separates its signed build from its publish. The build job clones the VS Code
# source and runs a full npm install and gulp build against it, and anything
# that runs inside a job can rewrite the action code a later step of the same
# job executes, so a write-scoped token anywhere in that job is reachable from
# build-time code whether or not a step names it. The publish job runs nothing
# but a download, the release action and one API call that moves the tag, and
# nothing from the build.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/codeoss-build.yml
    with:
      vscode_version: ${{ inputs.vscode_version }}
      runner: ${{ inputs.runner }}
      # The notes below name this run as the one that built the tree, so this run
      # has to build it. Run 39550459306 restored a cached tarball instead and
      # published it under that claim; the cache would have served the same bytes
      # to every dispatch until an input changed.
      fresh: true

  publish:
    name: Publish the server tarball
    runs-on: ubuntu-latest
    needs: build
    # A download and one release upload of a few hundred megabytes; generous,
    # because a cap that trips here costs the whole build above to retry.
    timeout-minutes: 30
    # One publish per version at a time. Two overlapping ones could leave the
    # notes, the asset and the tag each naming a different build, and both jobs
    # green: the release action recovers from a clash with another writer
    # rather than failing. Queued rather than cancelled, so whichever publish
    # runs last writes all three. GitHub keeps one waiting job per group, and a
    # third publish of the same version replaces one still waiting.
    concurrency:
      group: server-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    # The only job that writes. It builds nothing and downloads nothing beyond
    # the artifact the build job produced, so the write scope is held for the
    # seconds it is used rather than for the whole build above.
    permissions:
      contents: write

    steps:
      - name: Download server tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-reh-web-linux-arm64-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/codeoss

      # The artifact above expires; this does not. release.yml and local builds
      # fetch from here, so the tree a release ships is the one the build job
      # built rather than whatever a maintainer happened to have on disk.
      #
      # Three settings keep this out of the app release channel, and the tag is
      # deliberately not v-prefixed because release.yml triggers on v*.
      #
      # ToolchainRegistry sends every non-Play install to
      # releases/latest/download/toolchain_*.zip, and this release carries no
      # toolchain, so it must never be what that path resolves to.
      #
      # make_latest: false alone does not achieve that, measured 2026-08-16: it
      # governs the moment of creation, not candidacy afterwards. This release
      # was created with it and still became the answer to /releases/latest,
      # because the app release that held the pointer was withdrawn to a draft
      # and GitHub had to choose again. That second choice takes the newest
      # non-draft non-prerelease by created_at, which was this one, and every
      # sideload toolchain download 404ed until someone noticed.
      #
      # prerelease: true is what makes it durable. A prerelease is excluded from
      # the latest pointer permanently rather than once, so no later withdrawal
      # can promote this. Nothing reads the pointer to find this tarball:
      # fetch-vscode-oss.sh asks for server-$VSCODE_VERSION by name.
      #
      # The notes name the commit, ref and run that were built. The action
      # rewrites them on every publish, so a rebuild at the same version
      # updates them. target_commitish places a tag this step creates; GitHub
      # ignores it for a tag that already exists, which the next step moves.
      - name: Publish the server tarball
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: server-${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Code - OSS server ${{ needs.build.outputs.version }}
          body: |
            Code - OSS `vscode-reh-web-linux-arm64` server tree for VS Code ${{ needs.build.outputs.version }}, built from source with the patches and branding in this repository applied before the build.

            Built from `${{ github.sha }}` on `${{ github.ref_name }}`, run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            Consumed by `scripts/fetch-vscode-oss.sh`. Not an app release.
          make_latest: false
          prerelease: true
          # Defaults to false, which would rewrite the notes and move the tag below
          # while the previous asset stays, and the release preflight would then
          # take that stale asset for one built from this commit.
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/codeoss/vscode-reh-web-linux-arm64-${{ needs.build.outputs.version }}.tar.gz

      # The release API never moves an existing tag, so a rebuild at a version
      # already published left the tag on the commit that first published it:
      # server-1.139.1 named 6c5dc847, which pins 1.138.0, while its tarball
      # came from bdcba46d. This moves it to the commit that was built. It runs
      # after the upload so that a refusal leaves the asset and the notes
      # correct, and it fails the job rather than leave the tag elsewhere.
      #
      # Only the remote tag moves. A clone that fetched it before keeps the
      # old commit without a word, and `git fetch --tags` there refuses the
      # update ("would clobber existing tag"), so the release notes are the
      # record of what was built. A clone catches up with
      #   git fetch --force origin 'refs/tags/server-*:refs/tags/server-*'
      - name: Point the tag at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: server-${{ needs.build.outputs.version }}
        run: |
          at=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          [ "$at" = "$GITHUB_SHA" ] && exit 0
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" -F force=true --silent || {
            echo "::error::$TAG is published but still names $at. Move it with: git push --force origin $GITHUB_SHA:refs/tags/$TAG"
            exit 1
          }
          echo "Moved $TAG from $at to $GITHUB_SHA"
