name: Build Code - OSS server

# Manual, and run once per VS Code version rather than once per app release: it
# clones the VS Code source and runs a full gulp build, which takes around half
# an hour. The tarball it publishes is what build.yml and release.yml then fetch,
# so the expensive build happens when the version moves, not on every tag.
on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: VS Code tag to build (defaults to the VSCODE_VERSION file)
        default: ""
        type: string
      runner:
        # Not a preference. Every native module in the tree is built for the
        # build host and only two are overlaid afterwards; @vscode/ripgrep's
        # postinstall in particular downloads a binary for whatever the host
        # reports. On an x64 runner the tree builds green and then fails at exec
        # on the device, with Search quietly returning nothing. The build script
        # refuses to package an x86-64 tree, so a wrong runner fails the job
        # rather than shipping.
        description: Runner to build on (must be arm64)
        default: ubuntu-24.04-arm
        type: string

# Read by default; the one job that publishes raises it, the way release.yml
# separates its signed build from its publish. The build job clones the VS Code
# source and runs a full npm install and gulp build against it, and anything
# that runs inside a job can rewrite the action code a later step of the same
# job executes, so a write-scoped token anywhere in that job is reachable from
# build-time code whether or not a step names it. The publish job runs nothing
# but a download and the release action.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.pin.outputs.version }}

    steps:
      # No persisted push token either: nothing here pushes, and a persisted one
      # would be readable by the npm install this job runs against upstream's
      # dependency tree for the length of the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the pinned version
        id: pin
        env:
          # Through the environment, never interpolated into the script body: a
          # workflow_dispatch input is attacker-controlled text as far as the
          # shell is concerned, and this one lands in a URL and a tag name.
          INPUT_VERSION: ${{ inputs.vscode_version }}
        run: |
          version="${INPUT_VERSION:-$(cat VSCODE_VERSION)}"
          case "$version" in
            *[!0-9.]*|"") echo "refusing version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building VS Code $version"

          # The commit to build. A tag is a mutable name, so it is the commit
          # that selects the source and the tag that is advisory -- the build
          # script fetches this SHA directly and then compares, rather than
          # fetching the tag and hoping.
          #
          # When the version comes from the file the commit does too, and the
          # build refuses anything else. An operator who overrides the version
          # is trying a tag before bumping to it, and there is no pin for that
          # yet -- so resolve it here and say so, which also hands them the SHA
          # to write into VSCODE_COMMIT if they go on to bump.
          if [ -n "$INPUT_VERSION" ]; then
            # Peeled first: for an annotated tag refs/tags/X is the tag object
            # and refs/tags/X^{} is the commit, and it is the commit that has to
            # be fetched. Asking for both in one call would not help, because
            # ls-remote sorts by refname and the unpeeled ref sorts first. Two
            # calls, no parsing.
            #
            # Do not delete the first call as dead code. It is dead against this
            # repository's pin today -- VS Code's tags are lightweight, so
            # refs/tags/X^{} does not exist and the fallback is what fires -- and
            # it stops being dead the first time upstream publishes an annotated
            # tag, silently pinning a tag object that no checkout can ever equal.
            # Verified against torvalds/linux v6.6, where the two refs differ:
            # 5260836 (tag object) against ffc2532 (commit).
            commit=$(git ls-remote https://github.com/microsoft/vscode.git "refs/tags/$version^{}" | cut -f1)
            [ -n "$commit" ] || commit=$(git ls-remote https://github.com/microsoft/vscode.git "refs/tags/$version" | cut -f1)
            echo "::notice::$version resolves to $commit - record this in VSCODE_COMMIT if you bump to it"
          else
            commit=$(cat VSCODE_COMMIT)
          fi

          # A failed ls-remote leaves this empty, and cut exits 0 either way, so
          # the emptiness is what gets tested rather than the pipeline's status.
          case "$commit" in
            *[!0-9a-f]*|"") echo "refusing commit: '$commit'" >&2; exit 1 ;;
          esac
          [ "${#commit}" -eq 40 ] || { echo "refusing commit, not 40 chars: $commit" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Pinned to commit $commit"

          # .nvmrc is authoritative for the build host. Reading it rather than
          # hardcoding keeps a version bump from silently building on the wrong
          # Node.
          #
          # Read at the commit, not at the tag, for the same reason the source
          # is fetched at the commit: a moved tag would otherwise pick the Node
          # of a tree this build is not building. Measured that raw serves a
          # SHA, and that an unknown one fails rather than returning something.
          node_version=$(curl -fsSL \
            "https://raw.githubusercontent.com/microsoft/vscode/${commit}/.nvmrc")
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "Building with Node $node_version"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pin.outputs.node }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libkrb5-dev libsecret-1-dev libx11-dev \
            libxkbfile-dev pkg-config python3 python3-setuptools

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: codeoss-npm-${{ steps.pin.outputs.version }}-${{ runner.arch }}
          restore-keys: codeoss-npm-${{ steps.pin.outputs.version }}-

      - name: Build
        env:
          VSCODE_VERSION: ${{ steps.pin.outputs.version }}
          VSCODE_COMMIT: ${{ steps.pin.outputs.commit }}
          WORK: ${{ runner.temp }}/codeoss
        run: |
          mkdir -p "$WORK"
          bash scripts/build-vscode-oss.sh

      - name: Report cost
        if: always()
        run: |
          df -h "${{ runner.temp }}" | tail -1
          du -sh "${{ runner.temp }}/codeoss"/* 2>/dev/null || true

      # What the publish job below attaches to the release, handed across as an
      # artifact so that job never has to build anything.
      - name: Upload server tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-reh-web-linux-arm64-${{ steps.pin.outputs.version }}
          path: ${{ runner.temp }}/codeoss/vscode-reh-web-linux-arm64-${{ steps.pin.outputs.version }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish the server tarball
    runs-on: ubuntu-latest
    needs: build
    # A download and one release upload of a few hundred megabytes; generous,
    # because a cap that trips here costs the half-hour build above to retry.
    timeout-minutes: 30
    # The only job that writes. It builds nothing and downloads nothing beyond
    # the artifact the build job produced, so the write scope is held for the
    # seconds it is used rather than for the half hour above.
    permissions:
      contents: write

    steps:
      - name: Download server tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-reh-web-linux-arm64-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/codeoss

      # The artifact above expires; this does not. build.yml and release.yml both
      # fetch from here, so the tree a release ships is the one the build job
      # built rather than whatever a maintainer happened to have on disk.
      #
      # Three settings keep this out of the app release channel, and the tag is
      # deliberately not v-prefixed because release.yml triggers on v*.
      #
      # ToolchainRegistry sends every non-Play install to
      # releases/latest/download/toolchain_*.zip, and this release carries no
      # toolchain, so it must never be what that path resolves to.
      #
      # make_latest: false alone does not achieve that, measured 2026-08-16: it
      # governs the moment of creation, not candidacy afterwards. This release
      # was created with it and still became the answer to /releases/latest,
      # because the app release that held the pointer was withdrawn to a draft
      # and GitHub had to choose again. That second choice takes the newest
      # non-draft non-prerelease by created_at, which was this one, and every
      # sideload toolchain download 404ed until someone noticed.
      #
      # prerelease: true is what makes it durable. A prerelease is excluded from
      # the latest pointer permanently rather than once, so no later withdrawal
      # can promote this. Nothing reads the pointer to find this tarball:
      # fetch-vscode-oss.sh asks for server-$VSCODE_VERSION by name.
      - name: Publish the server tarball
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: server-${{ needs.build.outputs.version }}
          name: Code - OSS server ${{ needs.build.outputs.version }}
          body: |
            Code - OSS `vscode-reh-web-linux-arm64` server tree for VS Code
            ${{ needs.build.outputs.version }}, built from source with the patches
            and branding in this repository applied before the build.

            Consumed by `scripts/fetch-vscode-oss.sh`. Not an app release.
          make_latest: false
          prerelease: true
          files: ${{ runner.temp }}/codeoss/vscode-reh-web-linux-arm64-${{ needs.build.outputs.version }}.tar.gz
