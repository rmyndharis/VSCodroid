name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Read by default. Neither job here publishes anything: the only step that
# reaches GitHub is the server fetch, which asks the API for a release asset.
# Without this block the token's scope is whatever the repository's default
# workflow permissions happen to be, which is a setting outside this file and
# outside review. release.yml has said this since it was written.
permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run Gradle plugins, npm postinstalls and the download
          # scripts, and none of them pushes: the server fetch asks the API with
          # GH_TOKEN scoped to its own step, and nothing else touches a remote. A
          # persisted checkout token would be readable by all of that for the
          # length of the job. Where checkout stores it is deliberately not named:
          # it has moved between major versions and this setting is right whatever
          # the location is.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up NDK
        run: |
          sdkmanager "ndk;27.2.12479018" --channel=0
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Pinned to the open-source implementation, not left to the default.
          #
          # gradle/actions v6 added cache-provider and defaults it to 'enhanced',
          # which the action's own description calls "the full-featured commercial
          # caching service (gradle-actions-caching)"; 'basic' is "a simple
          # open-source caching implementation based on GitHub Actions cache".
          # v4 declared no such input, so the version bump moved every Gradle job
          # here onto the commercial one without anything in this repository
          # saying so, including the job that holds the signing keystore.
          #
          # This project drops dependencies over their licences (Berkeley DB went
          # for being AGPL) and publishes a source offer covering 39 components.
          # Taking on a commercial service silently is not a decision a dependency
          # bump gets to make here. Naming the value also means a later default
          # change cannot move it again.
          cache-provider: basic

      # Cache downloaded tarballs/debs
      #
      # The .deb entry reads debs/, not the directory above it. It read
      # termux-packages/*.deb and matched none of the 72 files actually there,
      # so that cache never held a single package and every run refetched the
      # lot. Note the path list below is a literal block: a `#` line inside it
      # is a path, not a comment. (before extraction) to avoid re-downloading ~200MB
      - name: Cache download intermediates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/*.tar.gz
            toolchains/termux-packages/debs/*.deb
            toolchains/termux-packages/Packages
            toolchains/build/npm/
            toolchains/extensions/
            toolchains/musl/
          key: downloads-${{ hashFiles('VSCODE_VERSION', 'VSCODE_COMMIT', 'patches/**', 'branding/**', 'scripts/build-vscode-oss.sh', '.github/workflows/build-vscode-oss.yml', 'scripts/fetch-vscode-oss.sh', 'scripts/verify-server-tree.py', 'scripts/lib/termux-packages.sh', 'scripts/download-termux-tools.sh', 'scripts/download-node.sh', 'scripts/patch-default-shell.py', 'scripts/download-npm.sh', 'scripts/download-python.sh', 'scripts/download-extensions.sh', 'scripts/download-musl-loader.sh', 'scripts/verify-termux-index.sh', 'scripts/termux-repo-key.asc', 'scripts/alpine-devel-616ae350.rsa.pub', 'scripts/verify-android-elf.py', 'scripts/patch-python-platform.py', 'scripts/check-extension.py') }}
          restore-keys: |
            downloads-

      # Cache the generated assets directory (extracted, patched VS Code server + tools).
      # patches/, branding/ and build-vscode-oss.sh are in the key even though no
      # step here reads them: they shape the server tarball, which is republished
      # under the same server-<version> name when they change. On an assets cache
      # hit the fetch step - and its digest check against the release - never
      # runs, so this key is the only thing standing between a republished server
      # and a stale cached tree going into the APK.
      - name: Cache generated assets
        id: cache-assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            android/app/src/main/assets/vscode-reh/
            android/app/src/main/assets/usr/
            android/app/src/main/assets/extensions/
            android/app/src/main/jniLibs/arm64-v8a/
            server/vscode-reh/
          key: assets-${{ hashFiles('VSCODE_VERSION', 'VSCODE_COMMIT', 'patches/**', 'branding/**', 'scripts/build-vscode-oss.sh', '.github/workflows/build-vscode-oss.yml', 'scripts/fetch-vscode-oss.sh', 'scripts/package-assets.sh', 'scripts/verify-server-tree.py', 'scripts/check-patch-fingerprints.py', 'scripts/lib/termux-packages.sh', 'scripts/download-termux-tools.sh', 'scripts/download-node.sh', 'scripts/patch-default-shell.py', 'scripts/download-npm.sh', 'scripts/download-python.sh', 'scripts/download-extensions.sh', 'scripts/download-musl-loader.sh', 'scripts/build-native-addons.sh', 'scripts/build-glibc-shim.sh', 'scripts/glibc-shim.c', 'scripts/gen-glibc-forwarders.py', 'scripts/build-exec-trampoline.sh', 'scripts/exec-trampoline.c', 'scripts/build-claude-shim.sh', 'scripts/seccomp-shim.c', 'scripts/claude-launch.c', 'android/app/src/main/assets/extensions/**', 'scripts/verify-termux-index.sh', 'scripts/termux-repo-key.asc', 'scripts/alpine-devel-616ae350.rsa.pub', 'scripts/verify-android-elf.py', 'scripts/patch-python-platform.py', 'scripts/check-extension.py') }}
          # The fallback is what let a removed extension come back: it restores
          # any earlier tree, and the run then saves that tree forward under its
          # own key. It stays, because a partial hit still saves most of a build
          # -- download-extensions.sh now sweeps what it no longer manages, so a
          # restored tree is corrected rather than inherited.
          restore-keys: |
            assets-

      - name: Install system dependencies
        if: steps.cache-assets.outputs.cache-hit != 'true'
        # The runner image ships a baked apt index. Ubuntu keeps only the current
        # version of a package in the pool, so once the indexed one is superseded
        # the download 404s. Refresh the index before installing.
        #
        # Bounded, because an unbounded refresh is not a slow step, it is a lost
        # job: when the Azure mirror stops answering apt falls through to the
        # public archive and can sit there without output until the job's whole
        # 30 minute budget is gone, and every later step is reported as skipped
        # rather than as never reached. Measured twice on the same commit. Three
        # short attempts clear a transient stall; a real outage now fails in
        # minutes with the mirror named, and still fails, because installing off
        # a stale index is what the refresh above exists to prevent.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update; then
              break
            fi
            echo "  apt-get update stalled or failed (attempt $attempt of 3)"
          done
          # gnupg is on the runner image today, but the Termux index check is a
          # gate: naming it here keeps it from depending on what the image
          # happens to bake in.
          sudo apt-get install -y --no-install-recommends libarchive-tools gnupg

      # Download and prepare all assets (only if not cached)
      # Built from the MIT source by build-vscode-oss.yml and published as a
      # server-<version> release; this only downloads and checks it. Before the
      # pivot the tree came pre-built from Microsoft's update CDN, which is
      # covered by the Microsoft pre-release licence rather than MIT and so could
      # not be modified and redistributed inside an APK.
      - name: Fetch Code - OSS server
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-vscode-oss.sh

      - name: Copy the server into assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        # The same copy scripts/package-assets.sh performs, called rather than
        # restated. Two definitions of "packaging the server" stood here and in
        # that script with nothing comparing them, while three Gradle failure
        # messages told their reader to run `fetch-vscode-oss.sh &&
        # package-assets.sh` as though it were the step CI takes. It is now.
        run: bash scripts/package-assets.sh

      - name: Download Termux tools
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-termux-tools.sh

      - name: Download npm
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-npm.sh

      - name: Download Python
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-python.sh

      - name: Download extensions
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-extensions.sh

      # Claude Code is no longer bundled: the user installs the extension from
      # the marketplace and the CLI comes inside it, so nothing of Anthropic's is
      # redistributed here and the version is theirs to update. What this ships
      # is musl's loader, which is the only way that CLI starts on Android.
      - name: Download musl loader
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-musl-loader.sh

      # Before the native addons on purpose: build-native-addons.sh pairs its
      # headers against the runtime this step installs, and fails closed when
      # nothing is there to pair against. With the addons built first that gate
      # can never fire in CI: there is no runtime to compare the headers to yet,
      # so the pairing it exists to enforce is skipped rather than checked.
      - name: Fetch Node runtime
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-node.sh
      - name: Build native addons
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/build-native-addons.sh

      # libnode.so is Termux's nodejs-lts, not a hand-cross-compiled binary kept
      # as a release asset. The old one ran but segfaulted inside the Claude Code
      # CLI's subcommands, and there was no way to debug a build we could not
      # reproduce. Its version also decides which VS Code releases are reachable.
      # After the server tree is in place and after download-termux-tools.sh,
      # which wipes assets/usr/lib before repopulating it -- the stubs live there
      # and would not survive being built first.
      #
      # Scans for addons that were built against glibc and generates stub
      # libraries so Bionic's loader will accept them. Objects needing libstdc++
      # are reported and skipped: Android ships libc++, and the two are not two
      # spellings of the same library.
      - name: Build the glibc compatibility shim
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          bash scripts/build-glibc-shim.sh \
            --scan android/app/src/main/assets/vscode-reh \
            --scan android/app/src/main/assets/extensions

      # The one binary this repository compiles for the app itself rather than
      # taking from Termux. It is what puts a downloaded toolchain's commands on
      # PATH as real files, so anything that resolves a bare name and execve's
      # the result -- an extension spawning `ruby`, a make recipe under mksh, a
      # "type": "process" task -- can start them at all.
      #
      # Its script and its source are in the assets- cache key above, and that is
      # not optional bookkeeping: this step is skipped on a cache hit, and a
      # restored jniLibs directory without the trampoline in it ships an APK that
      # behaves exactly as before with every gate in this workflow green.
      - name: Build the execution trampoline
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash scripts/build-exec-trampoline.sh

      - name: Build the Claude Code seccomp shim
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: bash scripts/build-claude-shim.sh
      # Two `ls ... || true` lines stood here under this name, which is a
      # listing rather than a check: nothing it could print would fail the job,
      # an entirely empty assets tree included. That tree is gitignored build
      # output, and an APK built without it is the quietest failure this project
      # has -- it compiles, it installs, the splash screen appears, and then the
      # screen stays white because there is no server to start. The release
      # workflow's step of the same name at least weighed libnode.so.
      # Runs where the libraries actually exist, which lint.yml is not: it
      # builds stub assets, and a stub tree has nothing to attribute. Berkeley
      # DB shipped under AGPL-3.0 for every release before this check existed,
      # having arrived as a transitive Kerberos dependency that no step looked
      # at.
      - name: Check every shipped library is attributed
        run: python3 scripts/check-library-attribution.py

      # Deliberately not `if: cache-hit != 'true'`, and that is the whole point
      # of the step. download-extensions.sh runs this after extracting, but that
      # step is skipped on a cache hit, which is most pull requests -- and the
      # rule that compares each tree's declared licence against the notices is
      # the one an edit to NOTICE.md is most likely to break. The trees come
      # back from the cache either way, so running it here reads them on every
      # build. lint.yml keeps the committed half for checkouts with no trees.
      - name: Check the bundled extensions match the notices
        run: python3 scripts/check-bundled-extensions.py

      - name: Verify assets
        run: |
          echo "=== Assets ==="
          ls -la android/app/src/main/assets/
          echo ""
          echo "=== jniLibs ==="
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          echo ""
          server=android/app/src/main/assets/vscode-reh/out/server-main.js
          libnode=android/app/src/main/jniLibs/arm64-v8a/libnode.so
          for f in "$server" "$libnode"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing; this APK would install and open with nothing in it."
              exit 1
            fi
          done
          # The unit-test and lint jobs write a 64-byte libnode.so so Gradle will
          # configure. Reaching a packaging job it would mean the real download
          # never ran.
          libnode_size="$(wc -c < "$libnode")"
          if [ "$libnode_size" -lt 1000 ]; then
            echo "::error::libnode.so is $libnode_size bytes -- that is the stub, not a runtime."
            exit 1
          fi
          echo "server-main.js present; libnode.so $libnode_size bytes"

      # Reads the packaged jniLibs, so it belongs here rather than with the
      # source-only checks: the directory is empty until the download scripts
      # above have run, and the gate refuses an empty one rather than passing
      # over it. Deliberately not in lint.yml, which stubs the tree with a single
      # four-byte libnode.so so Gradle will run.
      - name: Check the documented binary lists match what is packaged
        run: python3 scripts/check-binary-lists.py

      # Needs the extensions tree, so it runs here rather than beside the other
      # cheap checks in lint. A pattern that matches nothing is invisible twice:
      # the server keeps running, keeps counting against the phantom-process
      # budget, and the feature meant to reclaim it never sees it.
      - name: Check the monitor recognises the language servers that ship
        run: |
          python3 scripts/check-langserver-patterns.py \
            android/app/src/main/assets/vscode-reh/extensions

      # The welcome screen is committed source describing runtimes resolved from
      # the Termux index at build time, so anything it states about them is
      # correct only until the next rebuild. It was wrong for two releases and
      # nothing noticed, because a hardcoded string cannot disagree with itself.
      - name: Check the welcome screen states nothing that goes stale
        run: python3 scripts/check-welcome-claims.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, and its Gradle run reads only what is
          # already in the workspace. A persisted checkout token would sit
          # there readable by the Gradle plugins for the length of the job for
          # no reason. Where checkout stores it is deliberately not named: it
          # has moved between major versions and this setting is right
          # whatever the location is.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Pinned to the open-source implementation, not left to the default.
          #
          # gradle/actions v6 added cache-provider and defaults it to 'enhanced',
          # which the action's own description calls "the full-featured commercial
          # caching service (gradle-actions-caching)"; 'basic' is "a simple
          # open-source caching implementation based on GitHub Actions cache".
          # v4 declared no such input, so the version bump moved every Gradle job
          # here onto the commercial one without anything in this repository
          # saying so, including the job that holds the signing keystore.
          #
          # This project drops dependencies over their licences (Berkeley DB went
          # for being AGPL) and publishes a source offer covering 39 components.
          # Taking on a commercial service silently is not a decision a dependency
          # bump gets to make here. Naming the value also means a later default
          # change cannot move it again.
          cache-provider: basic

      # Unit tests only need compiled Kotlin, not the full assets.
      # Create minimal directory structure so Gradle does not fail.
      - name: Create minimal asset stubs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/vscode-reh/out
          mkdir -p android/app/src/main/assets/usr
          mkdir -p android/app/src/main/assets/extensions
          printf '\x7fELF' > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          dd if=/dev/zero bs=1 count=60 >> android/app/src/main/jniLibs/arm64-v8a/libnode.so 2>/dev/null

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      # Compiles the instrumented tests without running them, which is the only
      # thing CI can do for them and is better than the nothing that was here.
      #
      # They cannot be RUN on any runner GitHub offers, and all three families
      # have now been measured rather than assumed. The app is arm64-v8a only,
      # so the emulator has to be arm64 too; ubuntu-latest has /dev/kvm but only
      # accelerates x86_64, and ubuntu-24.04-arm reports no /dev/kvm and no
      # virtualisation flag at all.
      #
      # macos-15 was the open question until 2026-08-16, because Apple silicon
      # should mean HVF. It is itself a virtual machine, reporting
      # "Apple M1 (Virtual)" with kern.hv_support absent, so nested
      # virtualisation is not exposed and qemu fails with HV_UNSUPPORTED before
      # the emulator reaches adb. Measured on API 34 and 36 alike.
      #
      # So an arm64 image would be pure software emulation everywhere, for a
      # 340 MB APK that boots a Node server.
      #
      # What this does catch is the second way they were rotting: nothing
      # compiled them either, so they could drift out of the app's API and stay
      # broken indefinitely. See androidTest/README.md.
      #
      # Compiled here, run by a person: `scripts/device-test.sh --instrumented`
      # is the only thing that executes them, and it needs an arm64 device or
      # emulator attached. It is around a minute of wall clock, so skipping it
      # before a tag is a choice rather than a constraint -- and the one case no
      # other suite can replace is ExecTrampolineOnDeviceTest's control, which
      # asserts that a payload under filesDir cannot be executed directly. That
      # is a kernel policy decision, and the whole toolchain design rests on it.
      #
      # No count and no per-device timing here on purpose. Three of them were
      # written down across this file and the README, all three went stale, and
      # a figure in a comment is one nothing can check. The README carries them
      # against the recorded run, and check-instrumented-inventory.py holds it
      # to the sources.
      #
      # release.yml runs this same task, because a tag may name a commit that
      # reached neither of this workflow's triggers.
      - name: Compile the instrumented tests
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest
