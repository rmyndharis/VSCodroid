name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up NDK
        run: |
          sdkmanager "ndk;27.2.12479018" --channel=0
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cache downloaded tarballs/debs (before extraction) to avoid re-downloading ~200MB
      - name: Cache download intermediates
        uses: actions/cache@v4
        with:
          path: |
            server/*.tar.gz
            toolchains/termux-packages/*.deb
            toolchains/termux-packages/Packages
            toolchains/build/npm/
            toolchains/extensions/
            toolchains/musl/
          key: downloads-${{ hashFiles('VSCODE_VERSION', 'patches/**', 'branding/**', 'scripts/build-vscode-oss.sh', '.github/workflows/build-vscode-oss.yml', 'scripts/fetch-vscode-oss.sh', 'scripts/verify-server-tree.py', 'scripts/download-termux-tools.sh', 'scripts/download-node.sh', 'scripts/download-npm.sh', 'scripts/download-python.sh', 'scripts/download-extensions.sh', 'scripts/download-musl-loader.sh') }}
          restore-keys: |
            downloads-

      # Cache the generated assets directory (extracted, patched VS Code server + tools).
      # patches/, branding/ and build-vscode-oss.sh are in the key even though no
      # step here reads them: they shape the server tarball, which is republished
      # under the same server-<version> name when they change. On an assets cache
      # hit the fetch step - and its digest check against the release - never
      # runs, so this key is the only thing standing between a republished server
      # and a stale cached tree going into the APK.
      - name: Cache generated assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: |
            android/app/src/main/assets/vscode-reh/
            android/app/src/main/assets/usr/
            android/app/src/main/assets/extensions/
            android/app/src/main/jniLibs/arm64-v8a/
            server/vscode-reh/
          key: assets-${{ hashFiles('VSCODE_VERSION', 'patches/**', 'branding/**', 'scripts/build-vscode-oss.sh', '.github/workflows/build-vscode-oss.yml', 'scripts/fetch-vscode-oss.sh', 'scripts/verify-server-tree.py', 'scripts/download-termux-tools.sh', 'scripts/download-node.sh', 'scripts/download-npm.sh', 'scripts/download-python.sh', 'scripts/download-extensions.sh', 'scripts/download-musl-loader.sh', 'scripts/build-native-addons.sh', 'scripts/build-glibc-shim.sh', 'scripts/glibc-shim.c', 'scripts/gen-glibc-forwarders.py', 'android/app/src/main/assets/extensions/**') }}
          # The fallback is what let a removed extension come back: it restores
          # any earlier tree, and the run then saves that tree forward under its
          # own key. It stays, because a partial hit still saves most of a build
          # -- download-extensions.sh now sweeps what it no longer manages, so a
          # restored tree is corrected rather than inherited.
          restore-keys: |
            assets-

      - name: Install system dependencies
        if: steps.cache-assets.outputs.cache-hit != 'true'
        # The runner image ships a baked apt index. Ubuntu keeps only the current
        # version of a package in the pool, so once the indexed one is superseded
        # the download 404s. Refresh the index before installing.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools

      # Download and prepare all assets (only if not cached)
      # Built from the MIT source by build-vscode-oss.yml and published as a
      # server-<version> release; this only downloads and checks it. Before the
      # pivot the tree came pre-built from Microsoft's update CDN, which is
      # covered by the Microsoft pre-release licence rather than MIT and so could
      # not be modified and redistributed inside an APK.
      - name: Fetch Code - OSS server
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-vscode-oss.sh

      - name: Copy the server into assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/src/main/assets/
          rm -rf android/app/src/main/assets/vscode-reh
          cp -r server/vscode-reh android/app/src/main/assets/vscode-reh

      - name: Download Termux tools
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-termux-tools.sh

      - name: Download npm
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-npm.sh

      - name: Download Python
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-python.sh

      - name: Download extensions
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-extensions.sh

      # Claude Code is no longer bundled: the user installs the extension from
      # the marketplace and the CLI comes inside it, so nothing of Anthropic's is
      # redistributed here and the version is theirs to update. What this ships
      # is musl's loader, which is the only way that CLI starts on Android.
      - name: Download musl loader
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-musl-loader.sh

      # Before the native addons on purpose: build-native-addons.sh pairs its
      # headers against the runtime this step installs, and fails closed when
      # nothing is there to pair against. Review found the old order (addons
      # first) meant that gate could never fire in CI.
      - name: Fetch Node runtime
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/download-node.sh
      - name: Build native addons
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: bash scripts/build-native-addons.sh

      # libnode.so is Termux's nodejs-lts, not a hand-cross-compiled binary kept
      # as a release asset. The old one ran but segfaulted inside the Claude Code
      # CLI's subcommands, and there was no way to debug a build we could not
      # reproduce. Its version also decides which VS Code releases are reachable.
      # After the server tree is in place and after download-termux-tools.sh,
      # which wipes assets/usr/lib before repopulating it -- the stubs live there
      # and would not survive being built first.
      #
      # Scans for addons that were built against glibc and generates stub
      # libraries so Bionic's loader will accept them. Objects needing libstdc++
      # are reported and skipped: Android ships libc++, and the two are not two
      # spellings of the same library.
      - name: Build the glibc compatibility shim
        if: steps.cache-assets.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          bash scripts/build-glibc-shim.sh \
            --scan android/app/src/main/assets/vscode-reh \
            --scan android/app/src/main/assets/extensions
      - name: Verify assets
        run: |
          echo "=== Assets ==="
          ls -la android/app/src/main/assets/ || true
          echo ""
          echo "=== jniLibs ==="
          ls -la android/app/src/main/jniLibs/arm64-v8a/ || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Every other gate in this repository asserts a property of a file: right
  # architecture, dependencies resolvable, 16 KB alignment, digest matches,
  # native module paired with its JavaScript. None of them starts anything. That
  # is how five Python standard-library modules stayed dead for months, a Ruby
  # toolchain shipped without rake, and a Go compiler arrived without an execute
  # bit -- every build green throughout.
  #
  # The runner is arm64 because the APK is arm64-v8a only (abiFilters in
  # app/build.gradle.kts). An x86_64 runner would need ARM translation for every
  # bundled binary, which is the slow and least faithful way to answer "does the
  # thing we ship start". ubuntu-24.04-arm is already used by
  # build-vscode-oss.yml, so the label is known to resolve for this repository.
  runtime:
    name: Runtime Check
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug

      # Printed unconditionally and before the emulator, so a failure below can
      # be read against what the runner actually offered rather than guessed at.
      - name: Report runner capabilities
        run: |
          echo "arch        : $(uname -m)"
          echo "cpus        : $(nproc)"
          echo "kvm         : $([ -e /dev/kvm ] && echo present || echo ABSENT)"
          ls -la /dev/kvm 2>/dev/null || true
          echo "apk         : $(ls -la android/app/build/outputs/apk/debug/*.apk)"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Boot the app and make it work
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: arm64-v8a
          target: google_apis
          # The suite installs the APK it was handed and clears data itself; it
          # must not try to rebuild, since this runner has no assets tree.
          script: bash scripts/device-test.sh --skip-build --verbose

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Unit tests only need compiled Kotlin, not the full assets.
      # Create minimal directory structure so Gradle does not fail.
      - name: Create minimal asset stubs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/vscode-reh/out
          mkdir -p android/app/src/main/assets/usr
          mkdir -p android/app/src/main/assets/extensions
          printf '\x7fELF' > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          dd if=/dev/zero bs=1 count=60 >> android/app/src/main/jniLibs/arm64-v8a/libnode.so 2>/dev/null

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
