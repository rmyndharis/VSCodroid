name: Lint

# Both triggers, because the pull request is not how most code arrives here.
# Measured 2026-08-16: of 362 first-parent commits since v1.0.0, 11 are merges,
# so 351 landed straight on main and reached none of the gates below. The one
# that made this concrete is the patch-parse step: a prose edit inside a patch
# body that breaks its hunk header passes every other check in the repository,
# and without a push trigger it surfaced only in build-vscode-oss.yml, which is
# manual and runs once per VS Code bump. The diagnosis arrived weeks after the
# commit.
#
# Safe on push because every step below reads committed sources or the stubs it
# creates itself: no secrets, no downloaded assets, and no github.event field.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: "temurin"

      # No api-level here, and that is deliberate rather than an omission.
      # android-actions/setup-android has never declared one: its inputs are
      # cmdline-tools-version, accept-android-sdk-licenses,
      # log-accepted-android-sdk-licenses and packages. Passing api-level: 36
      # produced "Unexpected input(s) 'api-level'" on every run and set nothing,
      # for as long as it was there. The platform this build needs is fetched by
      # Gradle from compileSdk, which is why removing it changes no behaviour.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Pinned to the open-source implementation, not left to the default.
          #
          # gradle/actions v6 added cache-provider and defaults it to 'enhanced',
          # which the action's own description calls "the full-featured commercial
          # caching service (gradle-actions-caching)"; 'basic' is "a simple
          # open-source caching implementation based on GitHub Actions cache".
          # v4 declared no such input, so the version bump moved every Gradle job
          # here onto the commercial one without anything in this repository
          # saying so, including the job that holds the signing keystore.
          #
          # This project drops dependencies over their licences (Berkeley DB went
          # for being AGPL) and publishes a source offer covering 39 components.
          # Taking on a commercial service silently is not a decision a dependency
          # bump gets to make here. Naming the value also means a later default
          # change cannot move it again.
          cache-provider: basic

      # For the JavaScript self-checks below. Pinned rather than left to
      # whatever the runner image happens to carry, so the version they run
      # under is the same one build.yml uses.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Lint only needs compiled Kotlin, not runtime assets.
      # Create minimal directory structure so Gradle does not fail.
      - name: Create minimal asset stubs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/vscode-reh/out
          mkdir -p android/app/src/main/assets/usr
          mkdir -p android/app/src/main/assets/extensions
          printf '\x7fELF' > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          dd if=/dev/zero bs=1 count=60 >> android/app/src/main/jniLibs/arm64-v8a/libnode.so 2>/dev/null

      # Reads no assets and needs no toolchain, so it runs before the slow part
      # and reports the mismatch on its own rather than inside a lint report.
      - name: Check the documented build steps match the workflows
        run: python3 scripts/check-build-steps.py

      # Beside it because it asks the other half of the question: that one checks
      # which scripts the workflows run, this one checks that every step is a
      # step the runner will accept at all. Valid YAML is not valid workflow, and
      # a step carrying only a name loads cleanly and is rejected at dispatch.
      - name: Check every workflow step is runnable and pinned
        run: python3 scripts/check-workflow-steps.py

      # Same reasoning, one file further: reads two committed sources and no
      # assets. The contract an extension author writes against had never been
      # held to the bridge it describes, and one pass found fourteen
      # disagreements across twenty-eight methods.
      - name: Check the bridge API spec matches the registered signatures
        run: python3 scripts/check-bridge-api-spec.py

      # Reads two files and no assets, so it runs beside the other cheap check
      # rather than inside the build. What it guards arrives a whole release
      # after the change that causes it: raising targetSdk closes the local
      # network, and the symptom is a friend's browser timing out.
      - name: Check local network access survives the targetSdk in use
        run: python3 scripts/check-local-network-permission.py

      # Here rather than after `Run lint` below, because it reads the committed
      # baseline and not the report. The count lint prints is a property of the
      # machine: the same regenerated file filtered all 91 of its entries in the
      # checkout that wrote it and 46 anywhere else, so a report-based check
      # would read green exactly where the accident happens.
      - name: Check the lint baseline has not grown
        run: python3 scripts/check-lint-baseline.py

      # The committed half: the bundled extension list and the notices table are
      # two hand-kept copies of one fact, and each edit only ever touched one.
      # The other half of this script reads the extracted trees for the licence
      # they declare, and runs from download-extensions.sh, because those trees
      # are gitignored and no job here builds them.
      - name: Check the bundled extensions match the notices
        run: python3 scripts/check-bundled-extensions.py

      # `git apply --stat` parses a patch without needing the tree it applies to,
      # so the one thing that cannot be checked on a pull request -- whether the
      # patches still apply -- is separated here from the thing that can: whether
      # git can still read them at all. Editing prose inside a patch body without
      # adjusting the hunk header produces a file that every check in this
      # repository passed, because check-patch-fingerprints.py inspects the
      # downloaded server tree rather than the patches. The failure then surfaced
      # only in build-vscode-oss.yml, which is manual and runs once per VS Code
      # bump, so the diagnosis arrived weeks after the commit that caused it.
      - name: Check every patch is still readable by git
        run: |
          bad=0
          for p in patches/*.patch; do
            if ! git apply --stat "$p" >/dev/null 2>&1; then
              echo "::error file=$p::git cannot parse this patch; the hunk header line counts probably no longer match the body"
              git apply --stat "$p" || true
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "ok -- $(ls patches/*.patch | wc -l | tr -d ' ') patches parse"
          exit "$bad"

      # The device suite itself cannot run here -- no /dev/kvm on GitHub's arm64
      # runners, and the bundled binaries need Android's linker. What can run is
      # the part that rots silently: the versions it derives from the tree.
      - name: Check the device suite can still read what it asserts
        run: bash scripts/device-test.sh --self-check

      # The JavaScript that ships inside the APK: the server bootstrap, the
      # phantom-process monitor and the extension that displays it, the platform
      # override preloaded into every Node process, and the loopback DNS proxy.
      # All of them need Node and nothing else -- no assets, no SDK; the
      # extension is committed rather than downloaded -- so they belong beside
      # the other cheap gates rather than behind fifteen minutes of downloads in
      # build.yml.
      #
      # test-dns-proxy.js existed, passed, and was run by nothing. What it
      # covers is the Basic-auth token on the proxy every musl DNS lookup goes
      # through, and loopback on Android is not isolated per app: that token is
      # the only thing standing between the proxy and every other app on the
      # device.
      - name: Check the bundled JavaScript runtime
        run: |
          node scripts/test-dns-proxy.js
          node scripts/test-process-monitor.js
          node scripts/test-platform-fix.js
          node scripts/test-server-bootstrap.js
          node scripts/test-process-monitor-extension.js
          node scripts/test-bridge-relay.js
          node scripts/test-serve-network.js

      - name: Run lint
        working-directory: android
        run: ./gradlew lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          retention-days: 14
