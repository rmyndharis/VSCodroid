name: Lint

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # For the JavaScript self-checks below. Pinned rather than left to
      # whatever the runner image happens to carry, so the version they run
      # under is the same one build.yml uses.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Lint only needs compiled Kotlin, not runtime assets.
      # Create minimal directory structure so Gradle does not fail.
      - name: Create minimal asset stubs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/vscode-reh/out
          mkdir -p android/app/src/main/assets/usr
          mkdir -p android/app/src/main/assets/extensions
          printf '\x7fELF' > android/app/src/main/jniLibs/arm64-v8a/libnode.so
          dd if=/dev/zero bs=1 count=60 >> android/app/src/main/jniLibs/arm64-v8a/libnode.so 2>/dev/null

      # Reads no assets and needs no toolchain, so it runs before the slow part
      # and reports the mismatch on its own rather than inside a lint report.
      - name: Check the documented build steps match the workflows
        run: python3 scripts/check-build-steps.py

      # Reads two files and no assets, so it runs beside the other cheap check
      # rather than inside the build. What it guards arrives a whole release
      # after the change that causes it: raising targetSdk closes the local
      # network, and the symptom is a friend's browser timing out.
      - name: Check local network access survives the targetSdk in use
        run: python3 scripts/check-local-network-permission.py

      # The device suite itself cannot run here -- no /dev/kvm on GitHub's arm64
      # runners, and the bundled binaries need Android's linker. What can run is
      # the part that rots silently: the versions it derives from the tree.
      - name: Check the device suite can still read what it asserts
        run: bash scripts/device-test.sh --self-check

      # The JavaScript that ships inside the APK: the server bootstrap, the
      # phantom-process monitor, the platform override preloaded into every Node
      # process, and the loopback DNS proxy. All four need Node and nothing
      # else -- no assets, no SDK -- so they belong beside the other cheap gates
      # rather than behind fifteen minutes of downloads in build.yml.
      #
      # test-dns-proxy.js existed, passed, and was run by nothing. What it
      # covers is the Basic-auth token on the proxy every musl DNS lookup goes
      # through, and loopback on Android is not isolated per app: that token is
      # the only thing standing between the proxy and every other app on the
      # device.
      - name: Check the bundled JavaScript runtime
        run: |
          node scripts/test-dns-proxy.js
          node scripts/test-process-monitor.js
          node scripts/test-platform-fix.js
          node scripts/test-server-bootstrap.js

      - name: Run lint
        working-directory: android
        run: ./gradlew lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          retention-days: 14
